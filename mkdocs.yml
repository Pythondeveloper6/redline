site_name: Redline
site_description: "A request profiler, backend analyzer and load tester for Django, FastAPI, Flask and Litestar. N+1 detection with fix diffs, one-click EXPLAIN, flamegraphs, load testing and a fast web UI."
site_author: Mahmoud Ahmed
site_url: https://pythondeveloper6.github.io/redline/
repo_url: https://github.com/Pythondeveloper6/redline
repo_name: Pythondeveloper6/redline
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Mahmoud Ahmed &middot; MIT licence

strict: true
validation:
  links:
    anchors: warn

theme:
  name: material
  logo: assets/logo-mark.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Follow the system
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tooltips
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Pythondeveloper6/redline

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub's heading ids, so an anchor link works on github.com and here alike.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Get started:
      - Getting started: getting-started.md
      - How it works: how-it-works.md
      - The UI: the-ui.md
      - Server-Timing and the badge: server-timing-badge.md
  - Guide:
      - N+1 detection: n-plus-one.md
      - EXPLAIN: explain.md
      - Flamegraphs: flamegraphs.md
      - Custom spans: custom-spans.md
      - Issues and endpoints: issues-and-endpoints.md
      - Refactor check: refactor-check.md
  - Analysis:
      - Detectors overview: detectors.md
      - Performance workflows: performance-workflows.md
      - Real-world workflows: real-world-workflows.md
      - Queries and data:
          - Database: database.md
          - Static N+1 scan: static-scan.md
          - Large and unbounded results: result-size.md
          - Transactions and locks: transactions.md
          - GraphQL: graphql.md
      - Runtime behaviour:
          - Blocking in async: async-blocking.md
          - Slow serializers: serializers.md
          - External calls: external-calls.md
          - Cache efficiency: cache-efficiency.md
          - Logs and exceptions: logs-and-exceptions.md
  - Load and history:
      - Load testing: load-testing.md
      - History and releases: history.md
  - Integrations:
      - Frameworks:
          - Django: django.md
          - Django Ninja: django-ninja.md
          - FastAPI: fastapi.md
          - Flask: flask.md
          - Litestar: litestar.md
      - Libraries (requests, Redis, ...): integrations.md
      - Extending: extending.md
  - Operations:
      - Configuration: configuration.md
      - Access control: access-control.md
      - Production: production.md
      - Operating Redline: operating.md
      - Full-stack testing: testing.md
      - Security: security.md
      - Threat model: threat-model.md
      - Storage: storage.md
      - Performance and overhead: performance.md
  - Reference:
      - Settings reference: settings.md
      - The HTTP API: http-api.md
      - Command line: cli.md
      - Project:
          - Roadmap: roadmap.md
          - API stability: api-stability.md
          - FAQ: faq.md
          - Changelog: changelog.md
          - Contributing: contributing.md
