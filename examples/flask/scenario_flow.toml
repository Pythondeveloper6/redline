name = "flask shop: browse then open"
description = "A journey: list the orders, then open the first one from that list, with a check on the answer."
base_url = "http://127.0.0.1:8012"
timeout_s = 10

[[flows]]
name = "browse and open"
weight = 3

[[flows.steps]]
name = "list orders"
path = "/orders"
extract = { order_id = "$[0].id" }
expect = [{ json = "$[0].id" }]

[[flows.steps]]
name = "open that order"
path = "/orders/{var:order_id}"
expect = [{ json = "$.status" }]
max_ms = 2000

[[requests]]
name = "duplicate report"
path = "/report/duplicates"
weight = 1

[profile]
mode = "constant"
rps = 10
duration_s = "20s"
