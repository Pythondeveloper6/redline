[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-redline"
version = "0.4.0a1"
description = "A modern request profiler for Django: SQL timelines, N+1 detection with fix diffs, one-click EXPLAIN, flamegraphs and a fast web UI. Async-correct."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mahmoud Ahmed", email = "pythondeveloper6@gmail.com" }]
maintainers = [{ name = "Mahmoud Ahmed", email = "pythondeveloper6@gmail.com" }]
keywords = [
    "django",
    "profiler",
    "silk",
    "debug-toolbar",
    "performance",
    "n+1",
    "sql",
    "explain",
    "flamegraph",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
# Lockstep: the adapter pins the exact core release it was tested with. Django is
# upper-bounded on purpose: the bound moves only in the commit that adds the next
# Django to the CI matrix.
dependencies = ["redline-core==0.4.0a1", "Django>=5.2,<6.2"]

[project.optional-dependencies]
profile = ["redline-core[profile]==0.4.0a1"]

[project.urls]
Homepage = "https://github.com/Pythondeveloper6/redline"
Documentation = "https://pythondeveloper6.github.io/redline/django/"
Source = "https://github.com/Pythondeveloper6/redline"
Issues = "https://github.com/Pythondeveloper6/redline/issues"
Changelog = "https://github.com/Pythondeveloper6/redline/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "djangorestframework>=3.15",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyinstrument>=5.0",
    "django-ninja>=1.3",
]

[tool.uv.sources]
redline-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/django_redline"]
exclude = ["**/__pycache__", "**/*.py[cod]", "**/.DS_Store"]

[tool.hatch.build.targets.sdist]
include = ["/src/django_redline", "/tests", "/README.md", "/LICENSE"]
exclude = ["**/__pycache__", "**/*.py[cod]", "**/.DS_Store"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
extend = "../../pyproject.toml"
