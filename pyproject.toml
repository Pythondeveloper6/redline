# The repository root is a *virtual* uv workspace: it is not itself a distribution.
# The distributions live under packages/ and are released in lockstep:
#
#   packages/redline-core     -> redline-core     (redline_core)     engine + bundled UI
#   packages/django-redline   -> django-redline   (django_redline)   Django adapter
#   packages/fastapi-redline  -> fastapi-redline  (fastapi_redline)  FastAPI + SQLAlchemy adapter
#   packages/flask-redline    -> flask-redline    (flask_redline)    Flask + SQLAlchemy adapter
#   packages/litestar-redline -> litestar-redline (litestar_redline) Litestar + SQLAlchemy adapter
#
# `uv sync --all-packages` installs all of them, editable, plus the dev group below.
# Each package's tests run from its own directory (`cd packages/<dist> && uv run pytest`)
# because each has its own pytest configuration (pytest-django needs a settings module,
# the others must not see it).

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "uvicorn>=0.29",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "pyinstrument>=5.0",
    "a2wsgi>=1.10",
    "rq>=1.16",
    "fakeredis>=2.20",
    "dramatiq>=1.16",
]
docs = ["mkdocs-material>=9.5"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["site", "frontend", "packages/redline-core/tests/fixtures/static_precision", "examples/**/migrations", "*.md"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "C4", "RUF", "DJ",
    # Curated flake8-bandit rules: dangerous calls (exec/eval/pickle/yaml.load/shell=True),
    # unsafe XML, TLS verification, weak hashes, missing request timeouts. The noisy
    # heuristics (asserts, subprocess audits, SQL string building, "password" names) are
    # reviewed by hand instead.
    "S102", "S103", "S104", "S108", "S113", "S201", "S202", "S301", "S302", "S303", "S304",
    "S305", "S306", "S307", "S308", "S312", "S313", "S314", "S315", "S316", "S317", "S318",
    "S319", "S321", "S324", "S501", "S502", "S503", "S504", "S505", "S506", "S507", "S508",
    "S509", "S601", "S602", "S604", "S605", "S609", "S610", "S611", "S612", "S701", "S702",
    "S704",
]
# B008: FastAPI's `Depends(...)` in argument defaults is the framework's idiom.
# RUF012: declarative class attributes (Django Meta, admin options) are the idiom.
# RUF001-003: prose in docstrings and comments uses real typography (en dashes, arrows).
ignore = ["B008", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["redline_core", "django_redline", "fastapi_redline", "flask_redline", "litestar_redline"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "RUF012"]
"**/tests/**/*.py" = ["DJ008", "S102", "S103", "S104", "S108", "S314"]
"{examples,scripts,benchmarks}/**/*.py" = ["S104", "S108", "S314"]
