# Successful CI on main builds the exact tested commit. Publishing is an explicit
# exact-version opt-in via REDLINE_RELEASE_VERSION plus the pypi-* environment reviews.
# No branch, tag, pull-request or manual event directly starts this workflow.
name: Release

on:
  # Safe here: the build job only runs for a successful push to main of this repository
  # (never a fork's pull request) and checks out that exact tested commit.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]

# Serialize opt-in releases and duplicate checks; never cancel an upload in progress.
concurrency:
  group: redline-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and verify the distributions
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - name: Check lockstep versions and export the built version
        id: version
        run: |
          python3 scripts/check_versions.py
          python3 - <<'PYVERSION'
          import os
          import re
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("packages/redline-core/pyproject.toml").read_text())
          version = data["project"]["version"]
          if not re.fullmatch(r"[0-9][0-9A-Za-z.!+_-]*", version):
              raise SystemExit("Version is not safe for a release tag")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
          PYVERSION

      # The wheels ship the committed UI bundle, so publishing a stale one ships a UI that
      # does not match the frontend sources. Same check as CI's `frontend` job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Rebuild the UI
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Committed bundle is up to date
        run: |
          status="$(git status --porcelain -- packages/redline-core/src/redline_core/ui/static)"
          if [ -n "$status" ]; then
            echo "::error::The committed UI bundle is stale. Run scripts/build_ui.sh and commit the result."
            echo "$status"
            git diff --stat -- packages/redline-core/src/redline_core/ui/static
            exit 1
          fi

      - name: Build
        run: uv build --all-packages --out-dir dist

      # One upload step publishes everything in dist/, so the set must be exactly right.
      - name: Exactly five wheels and five sdists
        run: |
          ls -l dist
          wheels=$(find dist -maxdepth 1 -name '*.whl' | wc -l)
          sdists=$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)
          if [ "$wheels" -ne 5 ] || [ "$sdists" -ne 5 ]; then
            echo "::error::expected 5 wheels and 5 sdists, found $wheels and $sdists"
            exit 1
          fi

      - name: twine check
        run: uvx twine check --strict dist/*

      # Same gate as CI: install from the wheels alone, import, check the bundled UI.
      # A release is exactly the moment a wheel missing its UI would go unnoticed.
      - name: Install from the wheels alone and smoke-test
        run: |
          uv venv "$RUNNER_TEMP/wheelcheck"
          # Direct wheel paths guarantee this build is installed, including prereleases.
          # Third-party dependencies still resolve from PyPI as they do for users.
          VIRTUAL_ENV="$RUNNER_TEMP/wheelcheck" uv pip install dist/*.whl
          "$RUNNER_TEMP/wheelcheck/bin/python" scripts/smoke_wheels.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  authorize:
    name: Check exact-version opt-in and existing releases
    needs: build
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - name: Authorize only a new explicitly requested version
        id: gate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          BUILT_VERSION: ${{ needs.build.outputs.version }}
          REQUESTED_VERSION: ${{ vars.REDLINE_RELEASE_VERSION }}
        with:
          script: |
            core.setOutput('publish', 'false');
            const version = process.env.BUILT_VERSION;
            if (!version || process.env.REQUESTED_VERSION !== version) {
              core.notice('Build verified. Publishing requires REDLINE_RELEASE_VERSION to equal the built version exactly.');
              return;
            }
            const {owner, repo} = context.repo;
            const tag = `v${version}`;
            for (const lookup of [
              () => github.rest.repos.getReleaseByTag({owner, repo, tag}),
              () => github.rest.git.getRef({owner, repo, ref: `tags/${tag}`}),
            ]) {
              try {
                await lookup();
                core.notice(`${tag} already has a release or tag; skipping publication.`);
                return;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            // Do not mix a fresh build with a version already uploaded by another run.
            // Partial uploads recover by re-running failed jobs of their original run.
            const packages = ['redline-core', 'django-redline', 'fastapi-redline', 'flask-redline', 'litestar-redline'];
            let existing = 0;
            for (const name of packages) {
              const response = await fetch(`https://pypi.org/pypi/${name}/${encodeURIComponent(version)}/json`, {signal: AbortSignal.timeout(15000)});
              if (response.ok) existing++;
              else if (response.status !== 404) throw new Error(`PyPI lookup failed: ${response.status}`);
            }
            if (existing) {
              core.notice(`${existing} PyPI projects already contain ${version}; skipping publication. Recover partial uploads from their original run.`);
              return;
            }
            core.setOutput('publish', 'true');

  # Each package retains its existing trusted-publisher environment identity.
  publish-testpypi:
    name: Publish ${{ matrix.package }} to TestPyPI
    needs: [build, authorize]
    runs-on: ubuntu-latest
    if: >-
      needs.authorize.outputs.publish == 'true' &&
      vars.REDLINE_RELEASE_VERSION == needs.build.outputs.version
    strategy:
      fail-fast: false
      matrix:
        package: [redline-core, django-redline, fastapi-redline, flask-redline, litestar-redline]
    environment:
      name: testpypi-${{ matrix.package }}
      url: https://test.pypi.org/project/${{ matrix.package }}/
    permissions:
      # The OIDC token Trusted Publishing exchanges for a short-lived upload token.
      # Nothing else in this job needs a permission, so nothing else is granted.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: all/
      - name: Select this package's files
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir dist
          mv all/"${PACKAGE//-/_}"-* dist/
          ls dist
          test "$(ls dist | wc -l)" -eq 2
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # Failed jobs can resume the same tested run after a partial upload.
          skip-existing: true

  publish-pypi:
    name: Publish ${{ matrix.package }} to PyPI
    needs: [build, authorize, publish-testpypi]
    runs-on: ubuntu-latest
    if: >-
      needs.authorize.outputs.publish == 'true' &&
      vars.REDLINE_RELEASE_VERSION == needs.build.outputs.version
    strategy:
      fail-fast: false
      matrix:
        package: [redline-core, django-redline, fastapi-redline, flask-redline, litestar-redline]
    environment:
      name: pypi-${{ matrix.package }}
      url: https://pypi.org/project/${{ matrix.package }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: all/
      - name: Select this package's files
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir dist
          mv all/"${PACKAGE//-/_}"-* dist/
          ls dist
          test "$(ls dist | wc -l)" -eq 2
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # PEP 740 attestations, signed by the same OIDC identity. Free provenance.
          attestations: true
          # "Re-run failed jobs" after registering a missing publisher must not trip
          # over the packages that already uploaded.
          skip-existing: true

  github-release:
    name: Create the GitHub release
    needs: [build, authorize, publish-pypi]
    runs-on: ubuntu-latest
    if: >-
      needs.authorize.outputs.publish == 'true' &&
      vars.REDLINE_RELEASE_VERSION == needs.build.outputs.version
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Refuse a tag or release created since authorization
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          VERSION: ${{ needs.build.outputs.version }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const tag = `v${process.env.VERSION}`;
            for (const lookup of [
              () => github.rest.repos.getReleaseByTag({owner, repo, tag}),
              () => github.rest.git.getRef({owner, repo, ref: `tags/${tag}`}),
            ]) {
              try { await lookup(); }
              catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
              throw new Error(`${tag} appeared after authorization; inspect it before recovering this release.`);
            }
      - name: Create the release at the exact CI-tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version="$VERSION"
          tag="v$version"
          flags=()
          # PEP 440 pre-releases: 0.2.0a1, 0.2.0b2, 0.2.0rc1, 0.2.0.dev3
          if [[ "$version" =~ (a|b|rc|\.?dev)[0-9]+ ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TESTED_SHA" \
            --title "$tag" \
            --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TESTED_SHA/CHANGELOG.md) for what changed in this release." \
            "${flags[@]}"
