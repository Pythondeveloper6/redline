# Install and upgrade compatibility, the checks a user hits before any test runs:
#
#   clean-install-pypi    every distribution from PyPI (--pre) into its own brand-new venv,
#                         dependencies resolved from the network, then imported and smoked.
#   clean-install-wheels  the same for wheels built from this commit (core wheel pinned).
#   store-upgrade         a trace store written by each published redline-core release is
#                         opened (and migrated) by this commit; every trace must survive.
#
# Runs weekly so a broken upstream resolve or a yanked dependency shows up without a
# push, and on demand. Nothing here publishes anything.
name: Compatibility

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  clean-install-pypi:
    name: clean install from PyPI / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_clean_install.py --from-pypi

  clean-install-wheels:
    name: clean install from built wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - run: uv build --all-packages --out-dir dist
      - run: python scripts/check_clean_install.py --wheels dist

  store-upgrade:
    name: store written by ${{ matrix.from }} opens here
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Published redline-core releases; add each new one when it ships.
        from: ["0.2.0a1", "0.3.0a1", "0.4.0a1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
      - name: Write a store with redline-core ${{ matrix.from }}
        env:
          FROM_VERSION: ${{ matrix.from }}
        run: |
          uv venv "$RUNNER_TEMP/old"
          VIRTUAL_ENV="$RUNNER_TEMP/old" uv pip install "redline-core==$FROM_VERSION"
          "$RUNNER_TEMP/old/bin/python" -I scripts/check_store_upgrade.py write "$RUNNER_TEMP/store/traces.db"
      - name: Open it with this commit
        run: |
          uv sync --all-packages --frozen
          uv run --no-sync python scripts/check_store_upgrade.py read "$RUNNER_TEMP/store/traces.db"
