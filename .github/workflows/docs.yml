# Build the MkDocs Material site with --strict and publish it to GitHub Pages
# (https://pythondeveloper6.github.io/redline/).
#
# This workflow runs only on pushes to main, including merged pull requests.
# In repository settings, Pages must use "GitHub Actions"
# as its source.
name: Docs

on:
  push:
    branches: [main]

# Least privilege: only the deploy job can write to Pages or mint an OIDC token.
permissions:
  contents: read

# One deployment at a time; a newer push cancels one that is still queued, but never one
# that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the sources
      pages: read # configure-pages reads the site settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the site (strict)
        run: uv run --no-project --with mkdocs-material mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the built site
      id-token: write # the OIDC token deploy-pages exchanges with Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
