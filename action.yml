name: Redline refactor check
description: >-
  Run a Redline refactor check (record or compare) against a running app, write the report to
  the job summary and keep one sticky pull request comment up to date.
author: Pythondeveloper6
branding:
  icon: activity
  color: red

inputs:
  suite:
    description: Suite file (.toml or .json) listing the read-only requests to replay.
    required: true
  baseline:
    description: >-
      Baseline JSON. When the file exists the suite is compared with it, otherwise a baseline
      is recorded there. Defaults to the suite's own "<suite>.baseline.json".
    required: false
    default: ""
  base-url:
    description: Base URL of the running app. Defaults to the suite's base_url.
    required: false
    default: ""
  fail-on:
    description: Comma separated verdicts that fail the job (for example "slower,changed,broken"), or "none".
    required: false
    default: slower,changed,broken
  python-version:
    description: Python version used to run Redline.
    required: false
    default: "3.12"
  package:
    description: >-
      pip requirement for Redline, for example "redline-core[load]==0.5.0a1" or a git URL.
    required: false
    default: redline-core[load]
  comment:
    description: Post (and later update) one sticky comment on pull requests.
    required: false
    default: "true"
  github-token:
    description: Token used for the pull request comment. Needs pull-requests write access.
    required: false
    default: ${{ github.token }}
  marker-id:
    description: Identifies the sticky comment; use a different value per suite.
    required: false
    default: redline-check
  extra-args:
    description: Extra arguments for "redline check run" (for example "--no-store --label pr").
    required: false
    default: ""

outputs:
  exit-code:
    description: Exit code of "redline check run".
    value: ${{ steps.check.outputs.exit-code }}
  report:
    description: Path of the JSON report.
    value: ${{ steps.check.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Redline
      shell: bash
      env:
        REDLINE_PACKAGE: ${{ inputs.package }}
      run: python -m pip install --disable-pip-version-check "$REDLINE_PACKAGE"

    - name: Run the check
      id: check
      shell: bash
      env:
        IN_SUITE: ${{ inputs.suite }}
        IN_BASELINE: ${{ inputs.baseline }}
        IN_BASE_URL: ${{ inputs.base-url }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_EXTRA: ${{ inputs.extra-args }}
      run: |
        report="${RUNNER_TEMP}/redline-check.json"
        markdown="${RUNNER_TEMP}/redline-check.md"
        args=("$IN_SUITE" --json "$report" --markdown "$markdown" --fail-on "$IN_FAIL_ON")
        if [ -n "$IN_BASELINE" ]; then args+=(--baseline "$IN_BASELINE" --out "$IN_BASELINE"); fi
        if [ -n "$IN_BASE_URL" ]; then args+=(--base-url "$IN_BASE_URL"); fi
        # shellcheck disable=SC2086
        set +e
        redline check run "${args[@]}" $IN_EXTRA
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        echo "markdown=$markdown" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Job summary and pull request comment
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        IN_COMMENT: ${{ inputs.comment }}
        IN_MARKER: ${{ inputs.marker-id }}
        REPORT: ${{ steps.check.outputs.report }}
        MARKDOWN: ${{ steps.check.outputs.markdown }}
      run: |
        # a recording run (no baseline yet) writes no report; a usage error neither
        file="$REPORT"
        [ -f "$file" ] || file="$MARKDOWN"
        if [ ! -f "$file" ]; then echo "no report to publish"; exit 0; fi
        args=("$file" --marker-id "$IN_MARKER")
        if [ "$IN_COMMENT" != "true" ]; then args+=(--no-comment); fi
        redline check comment "${args[@]}"

    - name: Fail when the check failed
      shell: bash
      env:
        CODE: ${{ steps.check.outputs.exit-code }}
      run: exit "${CODE:-0}"
